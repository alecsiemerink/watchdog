[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-macos"
version = "0.1.1"
description = "A motion-triggered macOS room monitor with Hark alerts and private Tailscale viewing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alec Siemerink" }]
keywords = ["macos", "webcam", "motion-detection", "hark", "tailscale"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
  "Pillow>=10.0",
  "pyobjc-framework-Vision>=12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["ruff>=0.12"]

[project.scripts]
watchdog = "watchdog_app.cli:main"

[project.urls]
Repository = "https://github.com/alecsiemerink/watchdog"
Issues = "https://github.com/alecsiemerink/watchdog/issues"

[tool.setuptools.packages.find]
where = ["src"]
